icons_format = "<span font_weight='ultrabold' >{icon}</span>"

# [theme]
# theme = "plain"

# [icons]
# icons = "awesome4"

[[block]]
block = "battery"
format = " $icon $percentage "

[[block]]
block = "memory"
format = " $icon $mem_used_percents.eng(w:2) "

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90

[[block]]
block = "temperature"
format = " $icon $max "
interval = 10
chip = "*-isa-*"
[[block]]
block = "pomodoro"
notify_cmd = "swaynag -m 'Pomodoro finished!'"
blocking_cmd = true

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d/%m %R') "
